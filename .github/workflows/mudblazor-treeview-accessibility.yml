name: MudTreeView checkbox accessibility

on:
  push:
    branches:
      - fix/13977-treeview-checkbox-accessibility
  workflow_dispatch:

permissions:
  contents: read

jobs:
  treeview-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore src/MudBlazor.UnitTests/MudBlazor.UnitTests.csproj
      - name: Run TreeView accessibility tests
        run: >-
          dotnet test --project src/MudBlazor.UnitTests/MudBlazor.UnitTests.csproj
          --no-restore -p:SkipBunCompile=true --
          --filter "FullyQualifiedName~TreeViewAccessibilityTests"
          --output Normal --no-ansi
      - name: Run existing TreeView regression suite
        run: >-
          dotnet test --project src/MudBlazor.UnitTests/MudBlazor.UnitTests.csproj
          --no-restore -p:SkipBunCompile=true --
          --filter "FullyQualifiedName~TreeViewTests"
          --output Normal --no-ansi
      - name: Verify formatting
        working-directory: src
        run: >-
          dotnet format whitespace --folder --verify-no-changes
          --include
          MudBlazor/Components/TreeView/MudTreeViewItem.razor
          MudBlazor.UnitTests/Components/TreeViewAccessibilityTests.cs
