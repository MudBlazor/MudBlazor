name: MudBlazor pager accessibility tests

on:
  push:
    branches:
      - fix/13978-pager-accessibility
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pager-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET SDK from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore test project
        run: dotnet restore src/MudBlazor.UnitTests/MudBlazor.UnitTests.csproj

      - name: Compile and run pager tests
        run: >-
          dotnet test
          --project src/MudBlazor.UnitTests/MudBlazor.UnitTests.csproj
          --no-restore
          -p:SkipBunCompile=true
          --
          --filter 'FullyQualifiedName~MudTablePagerTests|FullyQualifiedName~MudDataGridPagerTests'
          --output Normal
          --no-ansi
          --hangdump
          --hangdump-timeout 30s

      - name: Verify formatting
        working-directory: src
        run: >-
          dotnet format whitespace --folder --verify-no-changes
          --include
          MudBlazor/Components/Table/MudTablePager.razor
          MudBlazor/Components/Table/MudTablePager.razor.cs
          MudBlazor/Components/DataGrid/MudDataGridPager.razor
          MudBlazor/Components/DataGrid/MudDataGridPager.razor.cs
          MudBlazor.UnitTests/Components/MudTablePagerTests.cs
          MudBlazor.UnitTests/Components/MudDataGridPagerTests.cs
