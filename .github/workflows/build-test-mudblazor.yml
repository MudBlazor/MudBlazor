name: build-test-mudblazor

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - dev
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  format-check:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          key: ${{ github.repository }}-nuget-${{ hashFiles('**/*.csproj') }}
          path: ${{ env.NUGET_PACKAGES }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      - name: Restore dependencies
        working-directory: src
        run: dotnet restore

      - uses: xt0rted/dotnet-format-problem-matcher@v1

      - name: Determine changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            src/**

      - name: dotnet format
        run: |
          if [ "${{ steps.changed-files.outputs.any_changed }}" != "true" ]; then
            exit 0
          fi
          dotnet format src --no-restore --verify-no-changes --include ${{ steps.changed-files.outputs.all_changed_files }}

  core-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          key: ${{ github.repository }}-nuget-${{ hashFiles('**/*.csproj') }}
          path: ${{ env.NUGET_PACKAGES }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.x
            9.x
            8.x

      - name: Restore dependencies
        working-directory: src
        run: dotnet restore

      - name: Build MudBlazor core
        working-directory: src
        run: dotnet build MudBlazor/MudBlazor.csproj -c Release --no-restore

  analyzers-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          key: ${{ github.repository }}-nuget-${{ hashFiles('**/*.csproj') }}
          path: ${{ env.NUGET_PACKAGES }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.x
            9.x
            8.x

      - name: Restore dependencies
        working-directory: src
        run: dotnet restore

      - name: Build analyzers
        working-directory: src
        run: dotnet build MudBlazor.Analyzers/MudBlazor.Analyzers.csproj -c Release --no-restore

      - name: Build analyzer code fixes
        working-directory: src
        run: dotnet build MudBlazor.Analyzers.CodeFixes/MudBlazor.Analyzers.CodeFixes.csproj -c Release --no-restore

      - name: Build analyzer test components
        working-directory: src
        run: dotnet build MudBlazor.Analyzers.TestComponents/MudBlazor.Analyzers.TestComponents.csproj -c Release --no-restore

  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          key: ${{ github.repository }}-nuget-${{ hashFiles('**/*.csproj') }}
          path: ${{ env.NUGET_PACKAGES }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.x
            9.x
            8.x

      - name: Restore dependencies
        working-directory: src
        run: dotnet restore

      - name: Build docs compiler
        working-directory: src
        run: dotnet build MudBlazor.Docs.Compiler/MudBlazor.Docs.Compiler.csproj -c Release --no-restore

      - name: Build docs site
        working-directory: src
        run: dotnet build MudBlazor.Docs/MudBlazor.Docs.csproj -c Release --no-restore

      - name: Build docs wasm
        working-directory: src
        run: dotnet build MudBlazor.Docs.Wasm/MudBlazor.Docs.Wasm.csproj -c Release --no-restore

      - name: Build docs wasm host
        working-directory: src
        run: dotnet build MudBlazor.Docs.WasmHost/MudBlazor.Docs.WasmHost.csproj -c Release --no-restore

      - name: Build docs server
        working-directory: src
        run: dotnet build MudBlazor.Docs.Server/MudBlazor.Docs.Server.csproj -c Release --no-restore

      - name: Build examples data
        working-directory: src
        run: dotnet build MudBlazor.Examples.Data/MudBlazor.Examples.Data.csproj -c Release --no-restore

  tools-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          key: ${{ github.repository }}-nuget-${{ hashFiles('**/*.csproj') }}
          path: ${{ env.NUGET_PACKAGES }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.x
            9.x
            8.x

      - name: Restore dependencies
        working-directory: src
        run: dotnet restore

      - name: Build docs tests generator
        working-directory: src
        run: dotnet build MudBlazor.UnitTests.Docs.Generator/MudBlazor.UnitTests.Docs.Generator.csproj -c Release --no-restore

      - name: Build unit tests shared
        working-directory: src
        run: dotnet build MudBlazor.UnitTests.Shared/MudBlazor.UnitTests.Shared.csproj -c Release --no-restore

      - name: Build unit tests viewer
        working-directory: src
        run: dotnet build MudBlazor.UnitTests.Viewer/MudBlazor.UnitTests.Viewer.csproj -c Release --no-restore

      # Benchmarks are intentionally excluded

  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          key: ${{ github.repository }}-nuget-${{ hashFiles('**/*.csproj') }}
          path: ${{ env.NUGET_PACKAGES }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.x
            9.x
            8.x

      - name: Restore dependencies
        working-directory: src
        run: dotnet restore

      - name: Build MudBlazor unit tests
        working-directory: src
        run: dotnet build MudBlazor.UnitTests/MudBlazor.UnitTests.csproj -c Release --no-restore

      - name: Test MudBlazor unit tests
        working-directory: src
        run: dotnet test MudBlazor.UnitTests/MudBlazor.UnitTests.csproj -c Release --no-build --blame-hang --blame-hang-timeout 60s /property:GenerateFullPaths=true /consoleloggerparameters:NoSummary /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:ExcludeByAttribute='ExcludeFromCodeCoverageAttribute' /p:ExcludeByAttribute='CompilerGeneratedAttribute' /p:ExcludeByFile='**/*.g.cs' /p:Include='[MudBlazor]*' /p:SkipAutoProps=true /p:CoverletOutput='./TestResults/unit-' --logger "junit;LogFilePath=TestResults/junit-unit.xml"

      - name: Publish coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: src/TestResults/junit-unit.xml

  analyzers-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          key: ${{ github.repository }}-nuget-${{ hashFiles('**/*.csproj') }}
          path: ${{ env.NUGET_PACKAGES }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.x
            9.x
            8.x

      - name: Restore dependencies
        working-directory: src
        run: dotnet restore

      - name: Build MudBlazor analyzers unit tests
        working-directory: src
        run: dotnet build MudBlazor.UnitTests.Analyzers/MudBlazor.UnitTests.Analyzers.csproj -c Release --no-restore

      - name: Test MudBlazor analyzers unit tests
        working-directory: src
        run: dotnet test MudBlazor.UnitTests.Analyzers/MudBlazor.UnitTests.Analyzers.csproj -c Release --no-build --blame-hang --blame-hang-timeout 60s /property:GenerateFullPaths=true /consoleloggerparameters:NoSummary /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:ExcludeByAttribute='ExcludeFromCodeCoverageAttribute' /p:ExcludeByAttribute='CompilerGeneratedAttribute' /p:ExcludeByFile='**/*.g.cs' /p:Include='[MudBlazor]*' /p:SkipAutoProps=true /p:CoverletOutput='./TestResults/analyzers-' --logger "junit;LogFilePath=TestResults/junit-analyzers.xml"

      - name: Publish analyzers coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload analyzers test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: src/TestResults/junit-analyzers.xml

  docs-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          key: ${{ github.repository }}-nuget-${{ hashFiles('**/*.csproj') }}
          path: ${{ env.NUGET_PACKAGES }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.x
            9.x
            8.x

      - name: Restore dependencies
        working-directory: src
        run: dotnet restore

      - name: Build MudBlazor docs unit tests
        working-directory: src
        run: dotnet build MudBlazor.UnitTests.Docs/MudBlazor.UnitTests.Docs.csproj -c Release --no-restore

      - name: Test MudBlazor docs unit tests
        working-directory: src
        run: dotnet test MudBlazor.UnitTests.Docs/MudBlazor.UnitTests.Docs.csproj -c Release --no-build --blame-hang --blame-hang-timeout 60s /property:GenerateFullPaths=true /consoleloggerparameters:NoSummary /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:ExcludeByAttribute='ExcludeFromCodeCoverageAttribute' /p:ExcludeByAttribute='CompilerGeneratedAttribute' /p:ExcludeByFile='**/*.g.cs' /p:Include='[MudBlazor]*' /p:SkipAutoProps=true /p:CoverletOutput='./TestResults/docs-' --logger "junit;LogFilePath=TestResults/junit-docs.xml"

      - name: Publish docs coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload docs test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: src/TestResults/junit-docs.xml
