name: DataGrid page-size ordering regression

on:
  push:
    branches:
      - fix/11521-datagrid-pager-custom-page-size
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore src/MudBlazor.UnitTests/MudBlazor.UnitTests.csproj
      - name: Run pager ordering regression tests
        run: >-
          dotnet test --project src/MudBlazor.UnitTests/MudBlazor.UnitTests.csproj
          --no-restore -p:SkipBunCompile=true --
          --filter "FullyQualifiedName~DataGridPager_RowsPerPage"
          --output Normal --no-ansi
      - name: Run DataGrid regression suite
        run: >-
          dotnet test --project src/MudBlazor.UnitTests/MudBlazor.UnitTests.csproj
          --no-restore -p:SkipBunCompile=true --
          --filter "FullyQualifiedName~MudBlazor.UnitTests.Components.DataGridTests"
          --output Normal --no-ansi
      - name: Verify formatting
        working-directory: src
        run: >-
          dotnet format whitespace --folder --verify-no-changes --include
          MudBlazor/Components/DataGrid/MudDataGridPager.razor
          MudBlazor/Components/DataGrid/MudDataGridPager.razor.cs
          MudBlazor.UnitTests/Components/DataGridTests.cs
          MudBlazor.UnitTests.Viewer/TestComponents/DataGrid/DataGridPagerNonOptionPageSizeTest.razor
