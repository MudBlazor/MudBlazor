name: MudNavGroup accessibility regression

on:
  push:
    branches:
      - fix/13980-navgroup-landmarks
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navgroup-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore src/MudBlazor.UnitTests/MudBlazor.UnitTests.csproj
      - name: Run NavGroup tests
        run: >-
          dotnet test --project src/MudBlazor.UnitTests/MudBlazor.UnitTests.csproj
          --no-restore -p:SkipBunCompile=true --
          --filter "FullyQualifiedName~NavGroupTests"
          --output Normal --no-ansi
