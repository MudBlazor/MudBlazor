name: AutoTriage (Backlog)

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      issues:
        description: "Issue or PR numbers (blank = backlog)"
        type: string
        required: false
      dry-run:
        description: "Plan without applying"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  triage:
    if: ${{ github.repository_owner == 'MudBlazor' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Queue every run instead of keeping only the newest pending one, so event runs wait for the sweep instead of being cancelled.
    concurrency:
      group: autotriage-db
      queue: max
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.MUDBOT_APP_ID }}
          private-key: ${{ secrets.MUDBOT_PRIVATE_KEY }}

      - uses: actions/checkout@v7

      - name: Restore triage DB
        uses: actions/cache/restore@v6
        with:
          path: triage-db.json
          key: ${{ runner.os }}-triage-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-triage-db-

      - name: AutoTriage - triage backlog
        uses: danielchalmers/AutoTriage@v5
        with:
          issues: ${{ inputs.issues }}
          # The nightly sweep is live, while a manual run only plans unless dry-run is unticked.
          dry-run: ${{ inputs.dry-run }}
          db-path: triage-db.json
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_TRIAGE }}

      # Saved even when the run fails, so the items it did triage aren't sent again tomorrow.
      # The key includes the attempt, so a re-run can save too.
      - name: Save triage DB
        if: always() && hashFiles('triage-db.json') != ''
        uses: actions/cache/save@v6
        with:
          path: triage-db.json
          key: ${{ runner.os }}-triage-db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: triage-artifacts-${{ github.run_number }}
          path: |
            triage-db.json
            artifacts/
