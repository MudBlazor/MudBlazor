name: AutoTriage (Backlog)

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      issues:
        description: "Space-separated issue numbers"
        required: false
      dry-run:
        description: "Run in dry-run mode (true = no writes)"
        type: boolean
        required: false
        default: true

concurrency:
  group: autotriage-backlog
  cancel-in-progress: true

jobs:
  triage:
    if: ${{ github.repository_owner == 'MudBlazor' }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.MUDBOT_APP_ID }}
          private-key: ${{ secrets.MUDBOT_PRIVATE_KEY }}

      - uses: actions/checkout@v6

      - name: Cache triage DB
        id: cache-db
        uses: actions/cache@v5
        with:
          path: triage-db.json
          key: ${{ runner.os }}-triage-db-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-triage-db-

      - name: AutoTriage - triage backlog
        uses: danielchalmers/AutoTriage@v3
        with:
          issues: ${{ github.event.inputs.issues }}
          prompt-path: .github/AutoTriage.prompt
          context-caching: true
          extended: true
          dry-run: ${{ github.event_name != 'schedule' && inputs['dry-run'] }}
          model-fast: gemini-2.5-flash
          max-fast-runs: 20
          model-pro: gemini-3-flash-preview
          db-path: triage-db.json
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: triage-artifacts-${{ github.run_number }}
          path: |
            triage-db.json
            artifacts/
