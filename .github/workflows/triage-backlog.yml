name: Triage Backlog

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      backlog-size:
        description: 'Number of issues to auto-discover'
        required: false
        default: '5'
        type: string
      issue-numbers:
        description: 'Or use issue numbers (space-separated)'
        required: false
        type: string
      model:
        description: 'Gemini model'
        required: false
        default: 'gemini-2.5-flash'
        type: string
      permissions:
        description: 'Permissions (empty for dry run)'
        required: false
        default: 'label, comment, stale, close' 
        type: string

jobs:
  auto-triage:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.repository == 'MudBlazor/MudBlazor'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install node-fetch@2 @actions/core @octokit/rest

      - name: Triage Issues
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOTRIAGE_MODEL: ${{ inputs.model }}
          AUTOTRIAGE_PERMISSIONS: ${{ inputs.permissions || vars.AUTOTRIAGE_PERMISSIONS }}
          MAX_ISSUES: ${{ github.event_name == 'schedule' && 50 || inputs.backlog-size }}
        run: |
          set -e
          
          if [ -n "${{ inputs.issue-numbers }}" ]; then
            echo "Processing specified issues: ${{ inputs.issue-numbers }}"
            issue_numbers="${{ inputs.issue-numbers }}"
            max_count=""
          else
            echo "Processing up to $MAX_ISSUES issues from the backlog."
            issue_numbers=$(gh issue list --state open --limit 9999 --json number --jq '.[].number')
            max_count="$MAX_ISSUES"
          fi

          count=0
          for issue_number in $issue_numbers; do
            if [ -n "$max_count" ] && [ "$count" -ge "$max_count" ]; then
              echo "Reached max issues ($max_count)"
              break
            fi
            echo "--- Processing Issue #${issue_number} ---"
            export GITHUB_ISSUE_NUMBER="$issue_number"
            node .github/scripts/AutoTriage.js
            count=$((count + 1))
            sleep 5
          done
