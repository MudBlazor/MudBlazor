name: Triage Backlog

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      backlog-size:
        description: 'Number of issues to auto-discover'
        required: false
        default: '5'
        type: string
      issue-numbers:
        description: 'Or use issue numbers (comma-separated)'
        required: false
        type: string
      model:
        description: 'Gemini model'
        required: false
        default: 'gemini-2.5-flash'
        type: string
      dry-run:
        description: 'Dry-run (no actual changes)'
        required: false
        default: true
        type: boolean

jobs:
  auto-triage:
    runs-on: ubuntu-latest
    # Run on dispatch or for scheduled runs on the main repository.
    if: github.event_name == 'workflow_dispatch' || github.repository == 'MudBlazor/MudBlazor'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm install node-fetch@2 @actions/core @octokit/rest

    - name: Restore Triage Database
      id: cache-db
      uses: actions/cache@v4
      with:
        # The path to the file to cache.
        path: .github/triage-db.json
        # A key to identify the cache.
        key: ${{ runner.os }}-triage-db-v1

    - name: Triage Issues
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        AUTOTRIAGE_ENABLED: ${{ inputs.dry-run != 'true' }}
        AUTOTRIAGE_MODEL: ${{ inputs.model }}
      run: |
        # MODE 1: Process specific issue numbers if provided. This mode bypasses the cache and 50-issue limit.
        if [ -n "${{ inputs.issue-numbers }}" ]; then
          echo "Processing specific issues provided via input: ${{ inputs.issue-numbers }}"
          echo "${{ inputs.issue-numbers }}" | tr ',' ' ' | while read -r issue_number; do
            if [ -n "$issue_number" ]; then
              echo "——————————————————————————————————Issue #$issue_number——————————————————————————————————"
              export GITHUB_ISSUE_NUMBER="$issue_number"
              export AUTOTRIAGE_ENABLED="${AUTOTRIAGE_ENABLED}"
              export AUTOTRIAGE_MODEL="${AUTOTRIAGE_MODEL}"
              node .github/scripts/AutoTriage.js
              sleep 3 # Rate limiting delay
            fi
          done
        else
          # MODE 2: Process backlog using the cache. Applies to scheduled runs or manual runs without specific numbers.
          DB_PATH=".github/triage-db.json"
          # Initialize a counter for processed issues.
          processed_count=0

          if [ ! -f "$DB_PATH" ]; then
            echo "Initializing new triage database."
            mkdir -p "$(dirname "$DB_PATH")"
            echo "{}" > "$DB_PATH"
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            LIMIT=${{ inputs.backlog-size }}
            echo "Manual run detected. Processing up to $LIMIT issues from the backlog."
          else
            LIMIT=99999
            echo "Scheduled run detected. Processing all open issues."
          fi

          echo "Fetching issues, sorted by most recently updated..."

          gh issue list --state open --limit "$LIMIT" --json number,updatedAt \
            --jq 'sort_by(.updatedAt) | reverse | .[]' | jq -c '.' | while IFS= read -r issue_json; do

            issue_number=$(echo "$issue_json" | jq '.number')
            issue_updated_at=$(echo "$issue_json" | jq -r '.updatedAt')

            last_triage_at=$(jq -r ".[\"$issue_number\"] // \"\"" "$DB_PATH")

            if [ -n "$last_triage_at" ]; then
              last_triage_seconds=$(date -d "$last_triage_at" +%s)
              issue_updated_seconds=$(date -d "$issue_updated_at" +%s)
              if [ "$last_triage_seconds" -ge "$issue_updated_seconds" ]; then
                echo "Skipping: Issue #${issue_number} has no new activity since last triage ($last_triage_at)."
                continue
              fi
            fi

            export GITHUB_ISSUE_NUMBER="$issue_number"
            export AUTOTRIAGE_ENABLED="${AUTOTRIAGE_ENABLED}"
            export AUTOTRIAGE_MODEL="${AUTOTRIAGE_MODEL}"
            node .github/scripts/AutoTriage.js

            current_timestamp=$(date --iso-8601=seconds)
            jq ".[\"$issue_number\"] = \"$current_timestamp\"" "$DB_PATH" > "${DB_PATH}.tmp" && mv "${DB_PATH}.tmp" "$DB_PATH"
            
            sleep 3

            # Increment the counter for successfully processed issues.
            processed_count=$((processed_count + 1))
            echo "Processed issues count: $processed_count"

            # Check if the processing limit has been reached.
            if [ "$processed_count" -ge 50 ]; then
              echo "✅ Reached processing limit of 50 issues."
              break
            fi
          done
        fi

        echo "Triage run complete."