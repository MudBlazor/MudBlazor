name: Triage Backlog

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      backlog-size:
        description: 'Number of issues to auto-discover'
        required: false
        default: '5'
        type: string
      issue-numbers:
        description: 'Or use issue numbers (space-separated)'
        required: false
        type: string
      model:
        description: 'Gemini model'
        required: false
        default: 'gemini-2.5-flash'
        type: string
      permissions:
        description: 'Permissions (`none` for dry run)'
        required: false
        default: 'label, comment, close, edit' 
        type: string

jobs:
  auto-triage:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || vars.AUTOTRIAGE_PERMISSIONS # Run manually or on a schedule if permissions are set up.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install node-fetch@2 @actions/core @octokit/rest

      - name: Triage Issues
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOTRIAGE_MODEL: ${{ inputs.model }}
          AUTOTRIAGE_PERMISSIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.permissions || vars.AUTOTRIAGE_PERMISSIONS }}
          AUTOTRIAGE_USE_DATABASE: true
          MAX_ISSUES: ${{ github.event_name == 'schedule' && 100 || inputs.backlog-size }}
        run: |
          if [ -n "${{ inputs.issue-numbers }}" ]; then
            echo "Processing specified issues: ${{ inputs.issue-numbers }}"
            issue_numbers="${{ inputs.issue-numbers }}"
            max_count=""
          else
            echo "Processing up to $MAX_ISSUES issues from the backlog"
            issue_numbers=$(gh issue list --state open --limit 9999 --search 'sort:updated-desc' --json number --jq '.[].number')
            max_count="$MAX_ISSUES"
          fi

          count=0
          exit_code=0
          for issue_number in $issue_numbers; do
            if [ -n "$max_count" ] && [ "$count" -ge "$max_count" ]; then
              echo "Reached max issues ($max_count)"
              break
            fi
            #echo "--- Processing Issue #${issue_number} ---"
            export GITHUB_ISSUE_NUMBER="$issue_number"
            node .github/scripts/AutoTriage.js || true
            exit_code=$?
            if [ -z "$exit_code" ]; then
              exit_code=0
            fi
            if [ "$exit_code" -eq 1 ]; then
              echo "❌ Fatal error while processing #${issue_number}"
              exit 1
            elif [ "$exit_code" -eq 2 ]; then
              exit_code=0
              continue
            elif [ "$exit_code" -eq 0 ]; then
              count=$((count + 1))
              left=$((max_count - count))
              echo "$(date '+%Y-%m-%d %H:%M:%S'): $left left"
              sleep 3
            fi
          done
