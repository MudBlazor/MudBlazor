name: AutoTriage

on:
  issues:
    types: [opened, reopened, edited]
  pull_request_target:
    types: [opened, reopened, ready_for_review, edited]
  issue_comment:
    types: [created]
# Manual runs go through autotriage-backlog.yml, which loads and saves the triage history.

permissions:
  contents: read

jobs:
  triage:
    # Only in MudBlazor's own repository, skipping draft PRs. Bots only trigger it by opening a PR, so MudBot's own edits can't loop.
    # A description edit re-checks an item only while it waits on a needs: label.
    if: >-
      github.repository_owner == 'MudBlazor' && !github.event.pull_request.draft &&
      (github.event.sender.type != 'Bot' || (github.event_name == 'pull_request_target' && github.event.action != 'edited')) &&
      (github.event.action != 'edited' ||
      contains(join(github.event.issue.labels.*.name, ','), 'needs:') || contains(join(github.event.pull_request.labels.*.name, ','), 'needs:'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Queue every run instead of keeping only the newest pending one, so a burst of new items all get triaged, and event runs wait for the backlog sweep.
    concurrency:
      group: autotriage-db
      queue: max
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.MUDBOT_APP_ID }}
          private-key: ${{ secrets.MUDBOT_PRIVATE_KEY }}

      # AutoTriage reads the policy and README from the checkout, so MudBot doesn't need contents access.
      - uses: actions/checkout@v7

      - name: AutoTriage - triage item
        uses: danielchalmers/AutoTriage@v5
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_TRIAGE }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: triage-artifacts-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: ignore
