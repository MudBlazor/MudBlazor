name: Bug Report
description: Tell us about a problem you found
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Report **a problem** in MudBlazor. For questions, use [Discussions](https://github.com/MudBlazor/MudBlazor/discussions) or [Discord](https://discord.gg/mudblazor).
  - type: checkboxes
    id: preconditions
    attributes:
      label: Before reporting
      options:
        - label: I searched existing issues
          required: true
        - label: I tried in private/incognito browser
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What went wrong?
      description: What did you expect, and what happened instead? A screenshot or short video helps, especially for layout or styling problems.
    validations:
      required: true
  - type: input
    id: repro-link
    attributes:
      label: Reproduction link
      description: A [try.mudblazor.com](https://try.mudblazor.com) snippet with an ID. If the bug reproduces on a [mudblazor.com](https://mudblazor.com) docs page, link that page. If it needs a host (Hybrid, prerendering, multiple projects), link a minimal public repository.
      placeholder: https://try.mudblazor.com/snippet/...
    validations:
      required: true
  - type: textarea
    id: repro-steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: bug-version
    attributes:
      label: Version (bug)
      description: Which version has the issue?
      placeholder: v9.x.x
    validations:
      required: true
  - type: input
    id: working-version
    attributes:
      label: Last working version
      description: Only if it worked in an earlier version. This marks the issue as a regression.
      placeholder: v9.x.x
  - type: dropdown
    id: environments
    attributes:
      label: Environment
      multiple: true
      options:
        - Chrome
        - Edge
        - Firefox
        - Safari
        - iOS
        - Android
        - MAUI / Hybrid
        - Other
  - type: dropdown
    id: rendering-mode
    attributes:
      label: Blazor rendering mode
      description: Where does the bug occur?
      multiple: true
      options:
        - Interactive WebAssembly
        - Interactive Server
        - Interactive Auto
        - Static server-side rendering
        - Hybrid
        - Not applicable / unknown
    validations:
      required: true
