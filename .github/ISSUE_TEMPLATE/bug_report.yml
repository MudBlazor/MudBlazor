name: Bug Report
description: Report a bug
labels: [triage]
body:
  - type: markdown
    attributes:
      value: |
        Use this template **only** for bug reports.  
        If you have a question, please use [GitHub Discussions](https://github.com/MudBlazor/MudBlazor/discussions) or [Discord](https://discord.gg/mudblazor).
  - type: checkboxes
    id: preconditions
    attributes:
      label: Before reporting
      options:
        - label: I have searched the **existing issues** for this bug
          required: true
        - label: I confirmed the bug also occurs in a **private/incognito** browser window (to rule out caching)
          required: true
    validations:
      required: true
  - type: dropdown
    id: bug-type
    attributes:
      label: Type of bug
      multiple: true
      options:
        - Component
        - Docs (mudblazor.com)
        - Other
    validations:
      required: true
  - type: input
    id: component-name
    attributes:
      label: Component name
      description: If this issue involves a component, please enter its name.
      placeholder: MudComponent
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Briefly describe the issue. You can add code snippets, screenshots, or videos. Enclose code snippets in backticks; do not upload them as images.
      placeholder: Describe the issue
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Clearly describe what you expected to happen.
      placeholder: Describe the expected behavior
    validations:
      required: true
  - type: input
    id: repro-link
    attributes:
      label: Reproduction link
      description: If possible, reproduce the issue on [try.mudblazor.com](https://try.mudblazor.com). Otherwise, share a link to a minimal GitHub repository (not a full application).
      placeholder: https://try.mudblazor.com/snippet/XXXXXXXXXXXXXXXX
    validations:
      required: true
  - type: textarea
    id: repro-steps
    attributes:
      label: Reproduction steps
      description: How can we trigger this bug? List each step.
      value: |
        1.
        2.
        3.
        ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. It will be automatically formatted as code, so backticks are not needed.
      render: shell
  - type: input
    id: bug-version
    attributes:
      label: Version (bug)
      description: Which version shows the issue?
      placeholder: v8.x.x
    validations:
      required: true
  - type: input
    id: working-version
    attributes:
      label: Version (working)
      description: If it worked before, on which version did it work?
      placeholder: v7.x.x
  - type: dropdown
    id: browsers
    attributes:
      label: Which browsers show the problem?
      description: You don't need to test every browser.
      multiple: true
      options:
        - Firefox
        - Chrome
        - Edge
        - Safari
        - Other
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Which operating systems show the issue?
      description: You don't need to test every OS.
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
        - iOS
        - Android
        - Other
    validations:
      required: true
  - type: dropdown
    id: rendering-mode
    attributes:
      label: Blazor rendering mode
      description: Specify the Blazor rendering mode you are using.
      multiple: false
      options:
        - WASM
        - Server
        - Hybrid
      default: 0
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/MudBlazor/MudBlazor/blob/dev/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
